services:
  app:
    build: .
    container_name: nanogpt_app
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - nanogpt_net

  nginx:
    image: nginx:alpine
    container_name: nanogpt_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - nanogpt_net

networks:
  nanogpt_net:
    driver: bridge