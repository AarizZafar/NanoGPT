services:
  app:
    build: .
    container_name: nanogpt_app
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - nanogpt_net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nanogpt_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - nanogpt_net

networks:
  nanogpt_net:
    driver: bridge